# Build and test on every push and pull request. This workflow deploys nothing:
# Netlify builds and hosts the site (netlify.toml, DEPLOY.md). It replaced the old
# GitHub Pages deploy workflow at the Phase 6 cutover.
name: CI

on:
  push:
    branches: [main, platform-v1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The Firebase emulators need Java 21 or newer.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # Brief section 8.4: run npm audit in CI. The full report is printed on every run; the job
      # fails on any critical advisory. Known, reviewed in SECURITY.md (2026-09-27): extract-zip
      # (high) is only used by Netlify's local dev server inside @astrojs/netlify, and uuid 9
      # (moderate) comes with firebase-admin's Cloud Storage client, which ARK doesn't use.
      # Neither is in the built site. Re-check both when those packages update.
      - run: npm audit || true
      - run: npm audit --audit-level=critical
      # Production build, with the same checks as Netlify's: alt text, internal links, inline
      # scripts against the CSP, and no service-account key in any browser bundle.
      - run: npm run build
      - run: npm run check
      - run: npm install -g firebase-tools@15.25.1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.25.1
      - run: npx playwright install --with-deps chromium
      # Contrast check, test build, then every Playwright test on the Auth + Firestore emulators
      # (project demo-ark). Tests never touch the real Firebase project.
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
