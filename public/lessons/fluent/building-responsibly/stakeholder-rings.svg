<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 656" width="440" height="656" role="img" aria-labelledby="t">
  <title id="t">Stakeholder map: direct users, operators, bystanders, society</title>
  <style>
    text { font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1C2430; }
    .r { font-size: 17px; font-weight: 700; }
    .k { font-size: 16px; font-weight: 700; }
    .s { font-size: 15px; fill: #4A5563; }
    .ring { stroke: #908776; stroke-width: 1.5; }
  </style>
  <rect width="440" height="656" rx="16" fill="#F4EFE6" />

  <circle class="ring" cx="220" cy="216" r="196" fill="#FFFFFF" />
  <circle class="ring" cx="220" cy="216" r="146" fill="#FCEBD0" />
  <circle class="ring" cx="220" cy="216" r="96" fill="#E3F1EC" />
  <circle cx="220" cy="216" r="48" fill="#1F6F5C" />

  <text class="r" x="220" y="51" text-anchor="middle">Society</text>
  <text class="r" x="220" y="101" text-anchor="middle">Bystanders</text>
  <text class="r" x="220" y="150" text-anchor="middle">Operators</text>
  <text class="r" x="220" y="210" text-anchor="middle" style="fill:#FFFFFF">Direct</text>
  <text class="r" x="220" y="231" text-anchor="middle" style="fill:#FFFFFF">users</text>

  <rect x="20" y="428" width="400" height="208" rx="12" fill="#FFFFFF" stroke="#E6DFD2" />
  <circle cx="42" cy="456" r="9" fill="#1F6F5C" />
  <text class="k" x="60" y="461">Direct users</text>
  <text class="s" x="60" y="482">The people who choose the product</text>
  <circle class="ring" cx="42" cy="504" r="9" fill="#E3F1EC" />
  <text class="k" x="60" y="509">Operators</text>
  <text class="s" x="60" y="530">Such as teachers, moderators, and support staff</text>
  <circle class="ring" cx="42" cy="552" r="9" fill="#FCEBD0" />
  <text class="k" x="60" y="557">Bystanders</text>
  <text class="s" x="60" y="578">People it touches who never signed up</text>
  <circle class="ring" cx="42" cy="600" r="9" fill="#FFFFFF" />
  <text class="k" x="60" y="605">Society</text>
  <text class="s" x="60" y="626">Where norms, jobs, and trust shift at scale</text>
</svg>
