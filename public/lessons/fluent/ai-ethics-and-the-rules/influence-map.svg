<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 560" width="440" height="560" role="img" aria-labelledby="t">
  <title id="t">Who has influence over AI: companies, governments, researchers and journalists, and the public</title>
  <style>
    text { font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1C2430; }
    .h { font-size: 17px; font-weight: 700; }
    .s { font-size: 15px; fill: #4A5563; }
    .k { font-size: 15px; }
    .box { fill: #FFFFFF; stroke: #908776; stroke-width: 1.5; }
    .shape { stroke: #1F6F5C; stroke-width: 2.5; fill: none; marker-end: url(#g); }
    .check { stroke: #BF780D; stroke-width: 2.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#o); }
  </style>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1F6F5C" />
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#BF780D" />
    </marker>
  </defs>
  <rect width="440" height="560" rx="16" fill="#F4EFE6" />

  <rect class="box" x="20" y="20" width="170" height="120" rx="12" />
  <text class="h" x="105" y="52" text-anchor="middle">Companies</text>
  <text class="s" x="105" y="81" text-anchor="middle">Build models and</text>
  <text class="s" x="105" y="101" text-anchor="middle">set defaults</text>
  <rect class="box" x="250" y="20" width="170" height="120" rx="12" />
  <text class="h" x="335" y="52" text-anchor="middle">Governments</text>
  <text class="s" x="335" y="81" text-anchor="middle">Write and enforce</text>
  <text class="s" x="335" y="101" text-anchor="middle">laws</text>
  <rect class="box" x="20" y="330" width="170" height="120" rx="12" />
  <text class="h" x="105" y="362" text-anchor="middle">Researchers and</text>
  <text class="h" x="105" y="383" text-anchor="middle">journalists</text>
  <text class="s" x="105" y="412" text-anchor="middle">Test systems and</text>
  <text class="s" x="105" y="432" text-anchor="middle">expose failures</text>
  <rect class="box" x="250" y="330" width="170" height="120" rx="12" />
  <text class="h" x="335" y="362" text-anchor="middle">The public</text>
  <text class="s" x="335" y="391" text-anchor="middle">Choose products,</text>
  <text class="s" x="335" y="411" text-anchor="middle">vote, comment,</text>
  <text class="s" x="335" y="431" text-anchor="middle">protest</text>
  <path class="shape" d="M190 140 L201.9 177.8" />
  <path class="shape" d="M250 140 L238.1 177.8" />
  <path class="shape" d="M190 330 L201.9 292.2" />
  <path class="shape" d="M250 330 L238.1 292.2" />

  <!-- Checks: governments on companies, researchers and journalists on companies, the public on governments -->
  <path class="check" d="M250 80 H196" />
  <path class="check" d="M105 330 V146" />
  <path class="check" d="M335 330 V146" />

  <circle cx="220" cy="235" r="54" fill="#1F6F5C" />
  <text class="h" x="220" y="231" text-anchor="middle" style="fill:#FFFFFF">AI</text>
  <text class="h" x="220" y="252" text-anchor="middle" style="fill:#FFFFFF">systems</text>

  <rect x="20" y="470" width="400" height="70" rx="12" fill="#FFFFFF" stroke="#E6DFD2" />
  <path class="shape" d="M38 494 H78" /><text class="k" x="92" y="499">Shapes AI systems</text>
  <path class="check" d="M38 520 H78" /><text class="k" x="92" y="525">Checks another group</text>
</svg>
