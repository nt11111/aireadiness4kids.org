<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 370" width="440" height="370" role="img" aria-labelledby="t">
  <title id="t">Three stages of building a chatbot: pretraining, fine-tuning, testing</title>
  <style>
    text { font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1C2430; }
    .h { font-size: 20px; font-weight: 700; }
    .s { font-size: 15px; fill: #4A5563; }
    .n { font-size: 15px; font-weight: 700; fill: #FFFFFF; }
    .box { fill: #FFFFFF; stroke: #908776; stroke-width: 1.5; }
    .disc { fill: #E3F1EC; }
    .ic { fill: #1F6F5C; }
    .arrow { stroke: #4A5563; stroke-width: 2; fill: none; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4A5563" />
    </marker>
  </defs>
  <rect width="440" height="370" rx="16" fill="#F4EFE6" />

  <!-- 1 Pretraining: books and a web page -->
  <rect class="box" x="20" y="20" width="400" height="92" rx="12" />
  <circle class="disc" cx="84" cy="66" r="38" />
  <rect class="ic" x="62" y="48" width="9" height="36" rx="2" />
  <rect x="73" y="52" width="9" height="32" rx="2" fill="#F2A93B" />
  <rect x="85" y="46" width="24" height="38" rx="3" fill="#FFFFFF" stroke="#1F6F5C" stroke-width="2" />
  <rect class="ic" x="85" y="46" width="24" height="7" rx="2" />
  <path d="M89 60 H105 M89 66 H101 M89 72 H105 M89 78 H99" stroke="#4A5563" stroke-width="2" stroke-linecap="round" />
  <circle cx="148" cy="66" r="14" fill="#C74D37" /><text class="n" x="148" y="71.5" text-anchor="middle">1</text>
  <text class="h" x="174" y="60">Pretraining</text>
  <text class="s" x="174" y="84">Predict the next token</text>
  <path class="arrow" d="M220 114 V 132" />

  <!-- 2 Fine-tuning: two people ranking two answers -->
  <rect class="box" x="20" y="138" width="400" height="92" rx="12" />
  <circle class="disc" cx="84" cy="184" r="38" />
  <circle cx="64" cy="175" r="6" fill="#4A5563" />
  <path d="M54 194 Q54 184 64 184 Q74 184 74 194 Z" fill="#4A5563" />
  <circle cx="104" cy="175" r="6" fill="#4A5563" />
  <path d="M94 194 Q94 184 104 184 Q114 184 114 194 Z" fill="#4A5563" />
  <rect class="ic" x="72" y="156" width="24" height="16" rx="3" />
  <text x="84" y="168.5" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#FFFFFF">1</text>
  <rect x="72" y="195" width="24" height="16" rx="3" fill="#FFFFFF" stroke="#908776" stroke-width="1.5" />
  <text x="84" y="207.5" text-anchor="middle" style="font-size:12px;font-weight:700">2</text>
  <circle cx="148" cy="184" r="14" fill="#C74D37" /><text class="n" x="148" y="189.5" text-anchor="middle">2</text>
  <text class="h" x="174" y="178">Fine-tuning</text>
  <text class="s" x="174" y="202">People rank the answers</text>
  <path class="arrow" d="M220 232 V 250" />

  <!-- 3 Testing: a test sheet with a score -->
  <rect class="box" x="20" y="256" width="400" height="92" rx="12" />
  <circle class="disc" cx="84" cy="302" r="38" />
  <rect x="66" y="280" width="34" height="44" rx="3" fill="#FFFFFF" stroke="#1F6F5C" stroke-width="2" />
  <path d="M71 291 l3 3 l5 -6 M71 302 l3 3 l5 -6 M71 313 l3 3 l5 -6" stroke="#1F6F5C" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M83 292 H95 M83 303 H95 M83 314 H95" stroke="#4A5563" stroke-width="2" stroke-linecap="round" />
  <circle cx="102" cy="320" r="11" fill="#F2A93B" />
  <path d="M97 320 l3.5 3.5 l6 -7" stroke="#1C2430" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="148" cy="302" r="14" fill="#C74D37" /><text class="n" x="148" y="307.5" text-anchor="middle">3</text>
  <text class="h" x="174" y="296">Testing</text>
  <text class="s" x="174" y="320">Scored on a benchmark</text>
</svg>
