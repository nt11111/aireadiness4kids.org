<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 430" width="440" height="430" role="img" aria-labelledby="t">
  <title id="t">Training data, training, model, prediction, with feedback flowing back as new data</title>
  <style>
    text { font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1C2430; }
    .h { font-size: 20px; font-weight: 700; }
    .s { font-size: 15px; fill: #4A5563; }
    .f { font-size: 16px; font-weight: 700; fill: #1C2430; }
    .box { fill: #FFFFFF; stroke: #908776; stroke-width: 1.5; }
    .model { fill: #E3F1EC; stroke: #1F6F5C; stroke-width: 1.5; }
    .arrow { stroke: #4A5563; stroke-width: 2; fill: none; marker-end: url(#a); }
    .loop { stroke: #BF780D; stroke-width: 2.5; fill: none; marker-end: url(#b); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4A5563" />
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#BF780D" />
    </marker>
  </defs>
  <rect width="440" height="430" rx="16" fill="#F4EFE6" />

  <rect class="box" x="30" y="24" width="290" height="76" rx="12" />
  <text class="h" x="50" y="56">Training data</text>
  <text class="s" x="50" y="82">Lots of examples</text>
  <path class="arrow" d="M175 102 V 122" />

  <rect class="box" x="30" y="126" width="290" height="76" rx="12" />
  <text class="h" x="50" y="158">Training</text>
  <text class="s" x="50" y="184">An algorithm finds patterns</text>
  <path class="arrow" d="M175 204 V 224" />

  <rect class="model" x="30" y="228" width="290" height="76" rx="12" />
  <text class="h" x="50" y="260">Model</text>
  <text class="s" x="50" y="286">Gets a new input</text>
  <path class="arrow" d="M175 306 V 326" />

  <rect class="box" x="30" y="330" width="290" height="76" rx="12" />
  <text class="h" x="50" y="362">Prediction</text>
  <text class="s" x="50" y="388">How likely you are to watch it</text>

  <path class="loop" d="M322 368 H392 V62 H328" />
  <rect x="378" y="167" width="28" height="96" rx="14" fill="#F4EFE6" />
  <text class="f" x="392" y="215" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 392 215)">Feedback</text>
</svg>
