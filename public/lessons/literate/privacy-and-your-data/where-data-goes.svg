<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 466" width="440" height="466" role="img" aria-labelledby="t">
  <title id="t">Where your data goes: collected, used, shared, sold</title>
  <style>
    text { font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1C2430; }
    .h { font-size: 22px; font-weight: 700; }
    .n { font-size: 15px; font-weight: 700; fill: #FFFFFF; }
    .box { fill: #FFFFFF; stroke: #908776; stroke-width: 1.5; }
    .disc { fill: #E3F1EC; }
    .ic { fill: #1F6F5C; }
    .arrow { stroke: #4A5563; stroke-width: 2; fill: none; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4A5563" />
    </marker>
  </defs>
  <rect width="440" height="466" rx="16" fill="#F4EFE6" />

  <!-- Collected: a phone -->
  <rect class="box" x="20" y="20" width="400" height="84" rx="12" />
  <circle class="disc" cx="88" cy="62" r="32" />
  <rect class="ic" x="75" y="40" width="26" height="44" rx="5" />
  <rect x="78.5" y="45" width="19" height="31" rx="2" fill="#FFFFFF" />
  <circle cx="88" cy="80" r="1.8" fill="#FFFFFF" />
  <circle cx="148" cy="62" r="14" fill="#C74D37" /><text class="n" x="148" y="67.5" text-anchor="middle">1</text>
  <text class="h" x="174" y="70">Collected</text>
  <path class="arrow" d="M220 106 V 128" />

  <!-- Used: a gear -->
  <rect class="box" x="20" y="134" width="400" height="84" rx="12" />
  <circle class="disc" cx="88" cy="176" r="32" />
  <g class="ic">
    <rect x="84" y="155" width="8" height="42" rx="2" />
    <rect x="84" y="155" width="8" height="42" rx="2" transform="rotate(45 88 176)" />
    <rect x="84" y="155" width="8" height="42" rx="2" transform="rotate(90 88 176)" />
    <rect x="84" y="155" width="8" height="42" rx="2" transform="rotate(135 88 176)" />
    <circle cx="88" cy="176" r="15" />
  </g>
  <circle cx="88" cy="176" r="6" fill="#E3F1EC" />
  <circle cx="148" cy="176" r="14" fill="#C74D37" /><text class="n" x="148" y="181.5" text-anchor="middle">2</text>
  <text class="h" x="174" y="184">Used</text>
  <path class="arrow" d="M220 220 V 242" />

  <!-- Shared: two overlapping circles -->
  <rect class="box" x="20" y="248" width="400" height="84" rx="12" />
  <circle class="disc" cx="88" cy="290" r="32" />
  <circle cx="80" cy="290" r="14" fill="#1F6F5C" />
  <circle cx="96" cy="290" r="14" fill="#F2A93B" fill-opacity="0.85" />
  <circle cx="148" cy="290" r="14" fill="#C74D37" /><text class="n" x="148" y="295.5" text-anchor="middle">3</text>
  <text class="h" x="174" y="298">Shared</text>
  <path class="arrow" d="M220 334 V 356" />

  <!-- Sold: a price tag -->
  <rect class="box" x="20" y="362" width="400" height="84" rx="12" />
  <circle class="disc" cx="88" cy="404" r="32" />
  <g transform="rotate(-35 88 404)">
    <path class="ic" d="M68 404 L79 391 H108 Q111 391 111 394 V414 Q111 417 108 417 H79 Z" />
    <circle cx="81" cy="404" r="3.5" fill="#E3F1EC" />
    <path d="M89 398 H103 M89 404 H100 M89 410 H103" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  </g>
  <circle cx="148" cy="404" r="14" fill="#C74D37" /><text class="n" x="148" y="409.5" text-anchor="middle">4</text>
  <text class="h" x="174" y="412">Sold</text>
</svg>
