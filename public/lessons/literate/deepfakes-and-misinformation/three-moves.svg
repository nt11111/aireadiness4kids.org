<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 404" width="440" height="404" role="img" aria-labelledby="t">
  <title id="t">Three moves before you share: stop, check the source, find a second source</title>
  <style>
    text { font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1C2430; }
    .h { font-size: 22px; font-weight: 700; }
    .n { font-size: 15px; font-weight: 700; fill: #FFFFFF; }
    .box { fill: #FFFFFF; stroke: #908776; stroke-width: 1.5; }
    .disc { fill: #E3F1EC; }
    .ic { fill: #1F6F5C; }
    .ln { stroke: #1F6F5C; stroke-width: 3; stroke-linecap: round; fill: none; }
    .arrow { stroke: #4A5563; stroke-width: 2; fill: none; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4A5563" />
    </marker>
  </defs>
  <rect width="440" height="404" rx="16" fill="#F4EFE6" />

  <!-- 1 Stop: a raised hand -->
  <rect class="box" x="20" y="20" width="400" height="100" rx="12" />
  <circle class="disc" cx="88" cy="70" r="38" />
  <g class="ic">
    <rect x="72" y="46" width="7" height="26" rx="3.5" />
    <rect x="81" y="41" width="7" height="31" rx="3.5" />
    <rect x="90" y="43" width="7" height="29" rx="3.5" />
    <rect x="99" y="49" width="7" height="23" rx="3.5" />
    <rect x="72" y="62" width="34" height="27" rx="9" />
    <rect x="60" y="64" width="20" height="8" rx="4" transform="rotate(40 70 68)" />
  </g>
  <circle cx="148" cy="70" r="14" fill="#C74D37" /><text class="n" x="148" y="75.5" text-anchor="middle">1</text>
  <text class="h" x="174" y="78">Stop</text>
  <path class="arrow" d="M220 122 V 146" />

  <!-- 2 Check the source: a magnifying glass over an account name -->
  <rect class="box" x="20" y="152" width="400" height="100" rx="12" />
  <circle class="disc" cx="88" cy="202" r="38" />
  <rect x="58" y="184" width="54" height="20" rx="10" fill="#FFFFFF" stroke="#908776" stroke-width="1.5" />
  <circle cx="68" cy="194" r="5" fill="#BF780D" />
  <path d="M78 194 H104" stroke="#4A5563" stroke-width="3" stroke-linecap="round" />
  <circle cx="94" cy="208" r="13" fill="#FFFFFF" fill-opacity="0.55" stroke="#1F6F5C" stroke-width="4" />
  <path d="M103.5 217.5 L114 228" stroke="#1F6F5C" stroke-width="6" stroke-linecap="round" />
  <circle cx="148" cy="202" r="14" fill="#C74D37" /><text class="n" x="148" y="207.5" text-anchor="middle">2</text>
  <text class="h" x="174" y="210">Check the source</text>
  <path class="arrow" d="M220 254 V 278" />

  <!-- 3 Find a second source: two browser tabs side by side -->
  <rect class="box" x="20" y="284" width="400" height="100" rx="12" />
  <circle class="disc" cx="88" cy="334" r="38" />
  <rect x="58" y="316" width="27" height="36" rx="4" fill="#FFFFFF" stroke="#1F6F5C" stroke-width="2" />
  <rect x="58" y="316" width="27" height="8" rx="3" class="ic" />
  <path d="M63 332 H80 M63 339 H76 M63 346 H79" stroke="#4A5563" stroke-width="2" stroke-linecap="round" />
  <rect x="91" y="316" width="27" height="36" rx="4" fill="#FFFFFF" stroke="#1F6F5C" stroke-width="2" />
  <rect x="91" y="316" width="27" height="8" rx="3" class="ic" />
  <path d="M96 332 H113 M96 339 H109 M96 346 H112" stroke="#4A5563" stroke-width="2" stroke-linecap="round" />
  <circle cx="148" cy="334" r="14" fill="#C74D37" /><text class="n" x="148" y="339.5" text-anchor="middle">3</text>
  <text class="h" x="174" y="342">Find a second source</text>
</svg>
